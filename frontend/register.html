<!DOCTYPE html>
<!-- Registration page: collects the minimum data needed to create an account. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>Register - Smart Traffic Challan System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/styles.css?v=17">
</head>
<body>

  <!-- Top Navbar (Deep Navy #0F172A) -->
  <header class="navbar">
    <a href="/" class="brand">
      <div class="brand-icon">
        <img src="/static/logo.png" alt="Smart Traffic Challan System logo">
      </div>
      <div>
        <div class="brand-title">Smart Traffic Challan System</div>
        <div class="brand-subtitle">AI Violation Surveillance</div>
      </div>
    </a>

    <nav class="nav-links" id="appNav" data-nav-mode="guest"></nav>
  </header>

  <!-- Register Container -->
  <main style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 140px); padding: 2rem 1.25rem;">
    <div class="card" style="max-width: 440px; width: 100%; padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); border-top: 4px solid var(--color-success);">
      <h2 style="font-size: 1.6rem; font-weight: 800; text-align: center; color: #0F172A; margin-bottom: 1.75rem;">Register</h2>

      <div id="registerMessage" style="display: none; background: #EFF6FF; border: 1px solid #BFDBFE; color: #1D4ED8; border-radius: 6px; padding: 10px 12px; margin-bottom: 1.25rem; text-align: center; font-size: 0.86rem;"></div>

      <form id="regForm">
        <div id="regFields">
          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="regName">Full Name</label>
            <input type="text" id="regName" class="text-input" placeholder="Enter Full Name" required>
          </div>

          <!-- Role -->
          <div class="form-group">
            <label class="form-label" for="regRole">Register As</label>
            <select id="regRole" class="text-input" required>
              <option value="Citizen">Citizen</option>
              <option value="Officer">Traffic Police Officer</option>
              <option value="Admin">Vehicle Registerer</option>
            </select>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address</label>
            <input type="email" id="regEmail" class="text-input" placeholder="Enter Email" required>
          </div>

          <!-- Password -->
          <div class="form-group" style="margin-bottom: 1.75rem;">
            <label class="form-label" for="regPassword">Password</label>
            <div style="position: relative;">
              <input type="password" id="regPassword" class="text-input" placeholder="Enter Password" required style="padding-right: 3rem;">
              <button type="button" class="password-toggle" data-password-target="regPassword" aria-label="Show password" title="Show password" style="position: absolute; top: 50%; right: 0.75rem; transform: translateY(-50%); border: 0; background: transparent; color: #64748B; cursor: pointer; padding: 0.35rem;">
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" id="btnRegister" class="btn btn-success" style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem; margin-bottom: 1.25rem;">
          Register
        </button>

        <div style="text-align: center; font-size: 0.88rem; color: #64748B;">
          Already have an account? <a href="/login" style="color: #2563EB; font-weight: 700; text-decoration: none;">Login</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="app-footer">
    © 2026 Smart Traffic Challan System | Final Year Project
  </footer>

  <script src="/static/js/auth.js?v=17"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const prefilledEmail = params.get('email');
    if (prefilledEmail) {
      const emailInput = document.getElementById('regEmail');
      if (emailInput) {
        emailInput.value = prefilledEmail;
      }
    }

    const regForm = document.getElementById('regForm');
    const registerMessage = document.getElementById('registerMessage');

    function setFieldError(fieldId, hasError) {
      const field = document.getElementById(fieldId);
      if (!field) return;
      field.style.borderColor = hasError ? '#dc2626' : '#bfdbfe';
      field.style.boxShadow = hasError ? '0 0 0 3px rgba(220, 38, 38, 0.12)' : 'none';
      field.style.background = hasError ? '#fef2f2' : '#f8fbff';
    }

    function markRegistrationFields() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('regRole').value;
      setFieldError('regName', !name);
      setFieldError('regEmail', !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
      setFieldError('regPassword', !password || password.length < 6);
      setFieldError('regRole', !role);
      return !!name && !!email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && !!password && password.length >= 6 && !!role;
    }

    function showMessage(text, style = 'info') {
      registerMessage.textContent = text;
      registerMessage.style.display = 'block';
      if (style === 'success') {
        registerMessage.style.background = '#ECFDF5';
        registerMessage.style.borderColor = '#A7F3D0';
        registerMessage.style.color = '#047857';
      } else if (style === 'error') {
        registerMessage.style.background = '#FEF2F2';
        registerMessage.style.borderColor = '#FECACA';
        registerMessage.style.color = '#B91C1C';
      } else {
        registerMessage.style.background = '#EFF6FF';
        registerMessage.style.borderColor = '#BFDBFE';
        registerMessage.style.color = '#1D4ED8';
      }
    }

    document.querySelectorAll('.password-toggle').forEach((toggle) => {
      toggle.addEventListener('click', () => {
        const input = document.getElementById(toggle.dataset.passwordTarget);
        const icon = toggle.querySelector('i');
        const isVisible = input.type === 'text';
        input.type = isVisible ? 'password' : 'text';
        toggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
        toggle.title = isVisible ? 'Show password' : 'Hide password';
        icon.className = isVisible ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
      });
    });

    async function handleRegister(e) {
      e.preventDefault();

      if (!markRegistrationFields()) {
        const invalidField = !document.getElementById('regName').value.trim() ? 'regName'
          : (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById('regEmail').value.trim()) ? 'regEmail'
          : (!document.getElementById('regPassword').value || document.getElementById('regPassword').value.length < 6 ? 'regPassword' : 'regRole'));
        setFieldError(invalidField, true);
        showMessage('Please correct the highlighted field(s) before continuing.', 'error');
        return;
      }

      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('regRole').value;
      const btn = document.getElementById('btnRegister');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Registering...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ name, email, password, role })
        });
        const data = await readApiResponse(res);
        if (data.success) {
          window.location.href = '/login?registered=1';
        } else {
          showMessage(data.detail || 'Registration failed.', 'error');
        }
      } catch (err) {
        showMessage('Network error: ' + err.message, 'error');
        btn.innerHTML = 'Register';
      } finally {
        btn.disabled = false;
      }
    }

    async function readApiResponse(response) {
      const contentType = response.headers.get('content-type') || '';
      const body = contentType.includes('application/json')
        ? await response.json()
        : { detail: (await response.text()).replace(/<[^>]*>/g, '').trim() };
      if (!response.ok) {
        throw new Error(body.detail || `Request failed (${response.status})`);
      }
      return body;
    }

    if (regForm) {
      regForm.addEventListener('submit', handleRegister);
    }
  </script>
</body>
</html>
