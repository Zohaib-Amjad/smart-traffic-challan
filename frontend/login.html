<!DOCTYPE html>
<!-- Login page: authenticates a user through the backend API. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>Login - Smart Traffic Challan System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/styles.css?v=17">
</head>
<body>

  <!-- Top Navbar (Deep Navy #0F172A) -->
  <header class="navbar">
    <a href="/" class="brand">
      <div class="brand-icon">
        <img src="/static/logo.png" alt="Smart Traffic Challan System logo">
      </div>
      <div>
        <div class="brand-title">Smart Traffic Challan System</div>
        <div class="brand-subtitle">AI Violation Surveillance</div>
      </div>
    </a>

    <nav class="nav-links" id="appNav" data-nav-mode="guest"></nav>
  </header>

  <!-- Login Container -->
  <main style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 140px); padding: 2rem 1.25rem;">
    <div class="card" style="max-width: 440px; width: 100%; padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); border-top: 4px solid var(--color-secondary);">
      <h2 style="font-size: 1.6rem; font-weight: 800; text-align: center; color: #0F172A; margin-bottom: 1.75rem;">Login</h2>
      <div id="registeredMessage" style="display: none; background: #ECFDF5; border: 1px solid #A7F3D0; color: #047857; border-radius: 6px; padding: 10px 12px; margin-bottom: 1.25rem; text-align: center; font-size: 0.86rem;">
          Your account has been created. Sign in with your email and password.
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <!-- Email Address -->
        <div class="form-group" id="loginEmailInputGroup">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="text-input" placeholder="Enter Email Address" required>
          <select id="loginSpecialEmail" class="text-input" style="display: none; margin-top: 0.5rem;"></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginRole">Login As</label>
          <select id="loginRole" class="text-input" required>
            <option value="Citizen">Citizen</option>
            <option value="Traffic Police Officer">Traffic Police Officer</option>
            <option value="Vehicle Registerer">Vehicle Registerer</option>
          </select>
        </div>

        <!-- Password -->
        <div class="form-group" style="margin-bottom: 1.75rem;">
          <label class="form-label" for="loginPassword">Password</label>
          <div style="position: relative;">
            <input type="password" id="loginPassword" class="text-input" placeholder="Enter Password" required style="padding-right: 3rem;">
            <button type="button" class="password-toggle" data-password-target="loginPassword" aria-label="Show password" title="Show password" style="position: absolute; top: 50%; right: 0.75rem; transform: translateY(-50%); border: 0; background: transparent; color: #64748B; cursor: pointer; padding: 0.35rem;">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button (Blue #2563EB) -->
        <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem; margin-bottom: 1.25rem;">
          Login
        </button>

        <!-- Register Link -->
        <div style="text-align: center; font-size: 0.88rem; color: #64748B;">
          Don't have an account? <a href="/register" style="color: #2563EB; font-weight: 700; text-decoration: none;">Register with special role</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="app-footer">
    © 2026 Smart Traffic Challan System | Final Year Project
  </footer>

  <script src="/static/js/auth.js?v=17"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('registered') === '1') {
      const msg = document.getElementById('registeredMessage');
      msg.textContent = 'Your account has been created. You can now sign in.';
      msg.style.display = 'block';
    }
    if (params.get('verified') === '1') {
      const msg = document.getElementById('registeredMessage');
      msg.style.display = 'block';
      msg.style.background = '#ECFDF5';
      msg.style.borderColor = '#A7F3D0';
      msg.style.color = '#047857';
      msg.textContent = 'Your account is ready. You can now sign in.';
    }

    const fixedLoginAccounts = {
      'Traffic Police Officer': [
        ['officer1@example.com', 'Officer@1234'],
        ['officer2@example.com', 'Officer@5678']
      ],
      'Vehicle Registerer': [
        ['registrar1@example.com', 'Registrar@1234'],
        ['registrar2@example.com', 'Registrar@5678']
      ]
    };

    function updateLoginRoleFields() {
      const role = document.getElementById('loginRole').value;
      const accounts = fixedLoginAccounts[role] || [];
      const emailInput = document.getElementById('loginEmail');
      const emailSelect = document.getElementById('loginSpecialEmail');
      emailSelect.innerHTML = '<option value="">Select account email</option>'
        + accounts.map(([email]) => `<option value="${email}">${email}</option>`).join('');
      emailInput.style.display = accounts.length ? 'none' : '';
      emailInput.required = !accounts.length;
      emailSelect.style.display = accounts.length ? '' : 'none';
      emailSelect.required = !!accounts.length;
      document.getElementById('loginPassword').value = '';
    }

    document.getElementById('loginRole').addEventListener('change', updateLoginRoleFields);
    document.getElementById('loginSpecialEmail').addEventListener('change', (event) => {
      const role = document.getElementById('loginRole').value;
      const selected = (fixedLoginAccounts[role] || []).find(([email]) => email === event.target.value);
      document.getElementById('loginEmail').value = event.target.value;
      if (selected) {
        document.getElementById('loginPassword').value = selected[1];
      }
    });

    document.querySelectorAll('.password-toggle').forEach((toggle) => {
      toggle.addEventListener('click', () => {
        const input = document.getElementById(toggle.dataset.passwordTarget);
        const icon = toggle.querySelector('i');
        const isVisible = input.type === 'text';
        input.type = isVisible ? 'password' : 'text';
        toggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
        toggle.title = isVisible ? 'Show password' : 'Hide password';
        icon.className = isVisible ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
      });
    });

    function setFieldError(fieldId, hasError) {
      const field = document.getElementById(fieldId);
      if (!field) return;
      field.style.borderColor = hasError ? '#dc2626' : '#bfdbfe';
      field.style.boxShadow = hasError ? '0 0 0 3px rgba(220, 38, 38, 0.12)' : 'none';
      field.style.background = hasError ? '#fef2f2' : '#f8fbff';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginSpecialEmail').value || document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const role = document.getElementById('loginRole').value;
      const emailValid = !!email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      const passwordValid = password.length >= 6;

      setFieldError('loginEmail', !emailValid);
      setFieldError('loginPassword', !passwordValid);

      if (!emailValid || !passwordValid) {
        alert('Please fix the highlighted field(s) before logging in.');
        return;
      }

      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, password, role })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          redirectAfterAuth();
        } else {
          if (res.status === 404 || /register first|No account found/i.test(data.detail || '')) {
            localStorage.removeItem('currentUser');
            document.cookie = 'auth_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            window.location.replace(`/register?email=${encodeURIComponent(email)}`);
            return;
          }
          alert(data.detail || 'Login failed.');
        }
      } catch (err) {
        alert('Network error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Login';
      }
    }
  </script>
</body>
</html>
